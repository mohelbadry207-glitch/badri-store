<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الديزل - تزويد المتابعين</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #131b2e;
            border: 2px solid #00ffcc;
            border-radius: 16px;
            padding: 25px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.3);
            text-align: center;
        }
        h1 {
            color: #00ffcc;
            font-size: 26px;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }
        .subtitle {
            color: #ffd700;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .ai-welcome {
            background: #1a2639;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px dashed #ffd700;
            font-size: 13px;
            color: #e2e8f0;
            text-align: right;
        }
        input, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: #0b0f19;
            border: 1px solid #00ffcc;
            color: #fff;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }
        .btn {
            background: linear-gradient(135deg, #00ffcc, #ffd700);
            color: #000;
            font-weight: bold;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            border: none;
            font-size: 16px;
            transition: 0.3s;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
        }
        .btn:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }
        #profileSection {
            display: none;
            margin-top: 15px;
        }
        .profile-img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid #ffd700;
            margin-bottom: 10px;
        }
        .privacy-link {
            display: block;
            margin-top: 20px;
            color: #a0aec0;
            font-size: 12px;
            text-decoration: underline;
            cursor: pointer;
        }
        #status {
            font-size: 14px;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>⚡ AL-DIESEL ⚡</h1>
        <div class="subtitle">منصة الديزل الاحترافية لتزويد المتابعين</div>
        
        <div class="ai-welcome" id="welcomeText">
            🤖 <strong>مرحباً بك يا غالي!</strong> أنا مساعد الذكاء الاصطناعي. نرحب بك في موقع الديزل لتجربة مذهلة وسريعة لتزويد متابعيك بكل أمان وأريحية.
        </div>

        <div id="step1">
            <input type="text" id="username" placeholder="أدخل اسم المستخدم (Username) فقط بدون كلمة المرور">
            <button class="btn" onclick="checkUser()">بحث عن الحساب 🔍</button>
        </div>

        <div id="profileSection">
            <img id="userAvatar" src="" alt="صورة الحساب" class="profile-img">
            <h3 id="displayName" style="color: #00ffcc; margin-bottom: 10px;"></h3>
            <p style="font-size: 13px; color: #ffd700; margin-bottom: 15px;">هل هذا هو حسابك الصحيح؟ اختر الباقة المناسبة:</p>
            
            <select id="packageSelect">
                <option value="100 Followrs">100 متابع</option>
                <option value="500 Followrs">500 متابع</option>
                <option value="1000 Followrs">1,000 متابع</option>
                <option value="5000 Followrs">5,000 متابع</option>
                <option value="10000 Followrs">10,000 متابع</option>
            </select>

            <button class="btn" onclick="sendOrder()">تأكيد وطلب المتابعين 🚀</button>
        </div>

        <div id="status"></div>

        <span class="privacy-link" onclick="alert('سياسة الخصوصية: نحن نحافظ على الأمان التام ولا نطلب أي كلمات مرور أبداً، خدمتنا تعتمد على اسم المستخدم العام فقط.')">سياسة الخصوصية وشروط الاستخدام</span>
    </div>

    <script>
        const TOKEN = "8730123549:AAGfIdQEXH1qXboe0aGMQZePGg5k4ec1tPU";
        const CHAT_ID = "5177962707";

        // تشغيل ترحيب صوتي خفيف باستخدام المتصفح (Web Speech API)
        window.onload = function() {
            if ('speechSynthesis' in window) {
                let utterance = new SpeechSynthesisUtterance("مرحباً بك في موقع الديزل لتزويد المتابعين، نتمنى لك تجربة جميلة وموفقة.");
                utterance.lang = 'ar-SA';
                utterance.rate = 1.0;
                // window.speechSynthesis.speak(utterance); // مفعلة في حال رغبت بالصوت التلقائي
            }
        };

        function checkUser() {
            const username = document.getElementById('username').value.trim();
            const statusDiv = document.getElementById('status');
            
            if (!username) {
                statusDiv.style.color = "#f56565";
                statusDiv.innerHTML = "❌ رجاءً أدخل اسم المستخدم أولاً!";
                return;
            }

            statusDiv.style.color = "#00ffcc";
            statusDiv.innerHTML = "⏳ جاري البحث عن الحساب وتحميل البيانات...";

            setTimeout(() => {
                // محاكاة جلب صورة وحساب المستخدم بدقة
                document.getElementById('userAvatar').src = "https://via.placeholder.com/150/131b2e/00ffcc?text=" + username.charAt(0).toUpperCase();
                document.getElementById('displayNameetat') = "@" + username;
                document.getElementById('step1').style.display = "none";
                document.getElementById('profileSection').style.display = "block";
                statusDiv.innerHTML = "";
            }, 1200);
        }

        async function sendOrder() {
            const username = document.getElementById('username').value.trim();
            const packageVal = document.getElementById('packageSelect').value;
            const statusDiv = document.getElementById('status');

            statusDiv.style.color = "#ffd700";
            statusDiv.innerHTML = "⏳ جاري إرسال طلبك إلى الإدارة...";

            const message = `🚨 طلب تزويد متابعين جديد!\n\n👤 اليوزر: @${username}\n📦 الباقة: ${packageVal}\n🌐 مصدر الطلب: تطبيق الديزل`;

            try {
                let response = await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
                    method: "POST",
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message
                    })
                });

                let data = await response.json();
                if (data.ok) {
                    statusDiv.style.color = "#48bb78";
                    statusDiv.innerHTML = "✅ تم استلام طلبك بنجاح! سيتم البدء في إرسال المتابعين قريباً.";
                } else {
                    statusDiv.style.color = "#f56565";
                    statusDiv.innerHTML = "❌ حدث خطأ أثناء إرسال الطلب.";
                }
            } catch (error) {
                statusDiv.style.color = "#f56565";
                statusDiv.innerHTML = "❌ خطأ في الاتصال بالشبكة.";
            }
        }
    </script>
</body>
</html>
