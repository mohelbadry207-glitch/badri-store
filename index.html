    <style>

        .code-editor { width: 100%; height: 100px; background: #000; color: #00ffcc; border: 1px solid #00ffcc; padding: 10px; border-radius: 5px; margin-top: 10px; }
        
        /* أيقونة الواتساب (يسار) */
        .whatsapp-float { position: fixed; bottom: 20px; left: 20px; z-index: 1000; }
