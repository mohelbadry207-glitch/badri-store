<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diesel Platform - Real System</title>
    <style>
        body { background-color: #0a0a0a; color: #ffd700; font-family: sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        h1 { color: #00ffcc; text-shadow: 0 0 10px #00ffcc; font-size: 2em; margin-bottom: 20px; }
        
        /* البطاقات الأساسية */
        .card { border: 2px solid #ffd700; border-radius: 15px; padding: 20px; margin: 10px 0; width: 90%; text-align: center; box-shadow: 0 0 15px #ffd700; }
        
        /* التنسيق الداخلي للمحتوى */
        .data-box { background: #000; padding: 15px; border-radius: 10px; border: 1px solid #00ffcc; margin-top: 10px; }
        
        /* زر الأزرار النيون */
        .nav-btn { display: block; background-color: transparent; color: #00ffcc; border: 1px solid #00ffcc; padding: 15px; margin: 5px; text-decoration: none; border-radius: 10px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

    <h1>Diesel Platform</h1>

    <div class="card" id="inventory">
        <h2 style="color: #00ffcc;">إدارة المخزون (بيانات حقيقية)</h2>
        <div id="inventory-data" class="data-box">جاري الاتصال بقاعدة البيانات...</div>
    </div>

    <div class="card" id="academy">
        <h2 style="color: #00ffcc;">أكاديمية ديزل</h2>
        <div class="data-box">
            <input type="text" id="code-input" placeholder="اكتب كود بايثون هنا..." style="width: 80%;">
            <button onclick="runCode()">تشغيل الكود</button>
            <p id="output" style="color: #fff;"></p>
        </div>
    </div>

    <script>
        // دالة تشغيل الأكواد (بسيطة للبداية)
        function runCode() {
            const input = document.getElementById('code-input').value;
            document.getElementById('output').innerText = "النتيجة: " + input;
        }

        // ملاحظة للمخزون: هنا يتم ربط المنصة بـ Google Sheet
        // ستحتاج لرفع هذا الكود على (GitHub Pages) وربطه بـ Google Sheets API
        document.getElementById('inventory-data').innerHTML = "المنتج: أبواب خشبية | الكمية: 150";
    </script>

    <script>
        (function(){if(!window.chatbase||window.chatbase("getState")!=="initialized"){window.chatbase=(...arguments)=>{if(!window.chatbase.q){window.chatbase.q=[]}window.chatbase.q.push(arguments)};window.chatbase=new Proxy(window.chatbase,{get(target,prop){if(prop==="q"){return target.q}return(...args)=>target(prop,...args)}})}const onLoad=function(){const script=document.createElement("script");script.src="https://www.chatbase.co/embed.min.js";script.id="DdngL8r3s2pfzL6hG2oIO";script.domain="www.chatbase.co";document.body.appendChild(script)};if(document.readyState==="complete"){onLoad()}else{window.addEventListener("load",onLoad)}})();
    </script>
</body>
</html>
