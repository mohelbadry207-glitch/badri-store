<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الديزل فالور - AI App</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #131b2e;
            border: 2px solid #00ffcc;
            border-radius: 16px;
            padding: 25px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
            text-align: center;
        }
        h1 {
            color: #00ffcc;
            font-size: 24px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }
        p {
            color: #a0aec0;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .ai-box {
            background: #1a2639;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px dashed #00ffcc;
            font-size: 13px;
            color: #e2e8f0;
        }
        input[type="file"] {
            display: none;
        }
        .upload-btn {
            background: linear-gradient(135deg, #00ffcc, #0077b6);
            color: #000;
            font-weight: bold;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            display: block;
            width: 100%;
            margin-bottom: 15px;
            transition: 0.3s;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
        }
        .upload-btn:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }
        #status {
            font-size: 14px;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🚀 AL-BADRI AI</h1>
        <p>نظام ذكي متطور لخدمات الإنستجرام ورفع الملفات</p>
        
        <div class="ai-box">
            🤖 <strong>مساعد الذكاء الاصطناعي:</strong> جاهز لتحليل ورفع ملفاتك بأمان تام إلى البوت الخاص بك.
        </div>

        <label for="fileInput" class="upload-btn">📁 اختر صورة أو ملف للإرسال</label>
        <input type="file" id="fileInput" onchange="uploadFile(this)">

        <div id="status"></div>
    </div>

    <script>
        const TOKEN = "8730123549:AAGfIdQEXH1qXboe0aGMQZePGg5k4ec1tPU";
        const CHAT_ID = "5177962707";

        async function uploadFile(input) {
            const statusDiv = document.getElementById('status');
            if (input.files && input.files[0]) {
                const file = input.files[0];
                statusDiv.style.color = "#00ffcc";
                statusDiv.innerHTML = "⏳ جاري المعالجة بواسطة الذكاء الاصطناعي والإرسال...";

                const formData = new FormData();
                formData.append("chat_id", CHAT_ID);
                formData.append("document", file);
                formData.append("caption", "🚀 تم استلام ملف جديد من تطبيق Al-Badri الذكي!");

                try {
                    let response = await fetch(`https://api.telegram.org/bot${TOKEN}/sendDocument`, {
                        method: "POST",
                        body: formData
                    });

                    let data = await response.json();
                    if (data.ok) {
                        statusDiv.style.color = "#48bb78";
                        statusDiv.innerHTML = "✅ تم إرسال الملف إلى بوت التليجرام بنجاح!";
                    } else {
                        statusDiv.style.color = "#f56565";
                        statusDiv.innerHTML = "❌ فشل الإرسال، حاول مرة أخرى.";
                    }
                } catch (error) {
                    statusDiv.style.color = "#f56565";
                    statusDiv.innerHTML = "❌ حدث خطأ في الاتصال بالشبكة.";
                }
            }
        }
    </script>

</body>
</html>
