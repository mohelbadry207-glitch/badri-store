<!DOCTYPE html>

        pre { background: #000; color: #fff; padding: 15px; border-radius: 10px; text-align: left; overflow-x: auto; border: 1px solid #00ffcc; }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; margin-top: 10px; }
        .video-container iframe { position: absolute; top:0; left:0; width: 100%; height: 100%; }
        table { width: 100%; color: #ffd700; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ffd700; padding: 8px; }

</head>

    print("Welcome to Diesel Academy")</pre>
    </div>

    <div class="card">

        <div class="video-container">
            <iframe src="https://www.youtube.com/embed/ضع_رابط_الفيديو_هنا" frameborder="0" allowfullscreen></iframe>
        </div>
    </div>

    <div class="card">
        <h2 style="color: #00ffcc;">إدارة المصنع والمخزون</h2>
        <table>
            <tr><th>المنتج</th><th>الكمية</th></tr>

        (function(){if(!window.chatbase||window.chatbase("getState")!=="initialized"){window.chatbase=(...arguments)=>{if(!window.chatbase.q){window.chatbase.q=[]}window.chatbase.q.push(arguments)};window.chatbase=new Proxy(window.chatbase,{get(target,prop){if(prop==="q"){return target.q}return(...args)=>target(prop,...args)}})}const onLoad=function(){const script=document.createElement("script");script.src="https://www.chatbase.co/embed.min.js";script.id="DdngL8r3s2pfzL6hG2oIO";script.domain="www.chatbase.co";document.body.appendChild(script)};if(document.readyState==="complete"){onLoad()}else{window.addEventListener("load",onLoad)}})();
