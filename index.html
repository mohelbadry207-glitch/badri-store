<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ديزل بلاتفورم - المنصة المتكاملة لتعلم البرمجة وإدارة المخازن والمشاريع.">
    <title>Diesel Platform | المنصة الرسمية</title>
    <style>
        /* التصميم النيون الأصلي */
        body { background-color: #0a0a0a; color: #ffd700; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        h1 { color: #00ffcc; text-shadow: 0 0 10px #00ffcc; font-size: 2.5em; }
        .card { border: 2px solid #ffd700; border-radius: 15px; padding: 20px; margin: 15px 0; width: 90%; max-width: 600px; background: #111; box-shadow: 0 0 15px #ffd700; }
        .btn-nav { display: block; color: #00ffcc; border: 1px solid #00ffcc; padding: 15px; margin: 10px 0; text-decoration: none; border-radius: 10px; font-weight: bold; text-align: center; }
        /* تحسينات لجوجل */
        .content-area { display: none; }
        .active { display: block; }
    </style>
</head>
<body>

    <h1>Diesel Platform</h1>

    <div class="card" id="main-menu">
        <a href="#" class="btn-nav" onclick="show('academy')">أكاديمية ديزل (الدروس)</a>
        <a href="#" class="btn-nav" onclick="show('videos')">مكتبة الفيديوهات</a>
        <a href="#" class="btn-nav" onclick="show('inventory')">إدارة المصنع والمخزون</a>
    </div>

    <div class="card content-area" id="academy">
        <h2>أكاديمية ديزل</h2>
        <p>محتوى تعليمي حصري يتم تحديثه دورياً.</p>
        <div id="academy-content">جاري تحميل الدروس...</div>
    </div>

    <div class="card content-area" id="videos">
        <h2>مكتبة الفيديوهات</h2>
        <div id="video-content">رابط التضمين الصحيح سيكون هنا</div>
    </div>

    <div class="card content-area" id="inventory">
        <h2>إدارة المخزون (بيانات حية)</h2>
        <table style="width:100%; border: 1px solid #ffd700;">
            <tr><th>المنتج</th><th>الكمية</th></tr>
            <tr><td>خامات ديزل</td><td>100</td></tr>
        </table>
    </div>

    <script>
        // دالة التبديل بين الأقسام
        function show(id) {
            document.querySelectorAll('.content-area').forEach(el => el.style.display = 'none');
            document.getElementById(id).style.display = 'block';
        }
    </script>
</body>
</html>
