<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DIESEL AI | OFFICIAL</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
        
        body { background-color: #fbfbfe; color: #2d3436; font-family: 'Cairo', sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow-x: hidden; }
        
        #main-app { width: 90%; max-width: 400px; text-align: center; }
        
        .section { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); margin-bottom: 20px; }
        
        .logo { font-size: 32px; font-weight: 700; color: #6c5ce7; margin-bottom: 10px; }
        
        .achievement-list { text-align: right; list-style: none; padding: 0; }
        .achievement-list li { margin: 10px 0; padding: 10px; border-bottom: 1px solid #f0f0f0; }
        .achievement-list li::before { content: "✓"; color: #00cec9; margin-left: 10px; }
    </style>
</head>
<body onload="startVoice()">

<div id="main-app">
    <div class="section">
        <div class="logo">DIESEL AI</div>
        <p>أهلاً بك في منصة الجيل الثالث</p>
    </div>

    <div class="section">
        <h3 style="color:#6c5ce7">إنجازاتي المعتمدة</h3>
        <ul class="achievement-list">
            <li>نظام حقن ذكي v6.2</li>
            <li>تشفير بيانات متطور 256-bit</li>
            <li>تحليل بيانات الذكاء الاصطناعي الفوري</li>
            <li>تكامل كامل مع أنظمة التنبيه العالمية</li>
        </ul>
    </div>
</div>

<script>
    // ترحيب صوتي بشري 100%
    function startVoice() {
        const msg = new SpeechSynthesisUtterance("مرحباً بك في موقع الديزل للذكاء الاصطناعي، نحن نغير قواعد اللعبة.");
        msg.lang = 'ar-SA';
        msg.rate = 0.9;
        window.speechSynthesis.speak(msg);
        
        // استدعاء البوت بعد الترحيب
        initChat();
    }

    function initChat() {
        window.chatbase = (...arguments) => { if (!window.chatbase.q) window.chatbase.q = []; window.chatbase.q.push(arguments); };
        const script = document.createElement("script");
        script.src = "https://www.chatbase.co/embed.min.js";
        script.id = "DdngL8r3s2pfzL6hG2oIO";
        document.body.appendChild(script);
    }
</script>
</body>
</html>
